x-showcase-app: &showcase-app
  build:
    context: .
  environment: &showcase-environment
    ENABLE_FAULT_INJECTION: "true"
    DEMO_API_KEY: "${DEMO_API_KEY:?Set DEMO_API_KEY before starting the fleet}"
    DEPLOYMENT_ENVIRONMENT: "local-compose"
    SHOWCASE_ROOT: "/workspace"
  restart: unless-stopped

services:
  retail-checkout:
    <<: *showcase-app
    environment:
      <<: *showcase-environment
      APP_SLUG: retail-checkout
    ports: ["8101:8080"]
  payments-api:
    <<: *showcase-app
    environment:
      <<: *showcase-environment
      APP_SLUG: payments-api
    ports: ["8102:8080"]
