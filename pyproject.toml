[project]
name = "sre-agent-enterprise-showcase"
version = "0.1.0"
description = "Fifteen observable FastAPI workloads for demonstrating Azure SRE Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-monitor-opentelemetry>=1.8.0,<2.0",
  "fastapi>=0.115.0,<1.0",
  "opentelemetry-api>=1.29.0,<2.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-sdk>=1.29.0,<2.0",
  "uvicorn[standard]>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0",
  "ipykernel>=6.29.0,<7.0",
  "ipywidgets>=8.1.0,<9.0",
  "pytest>=8.3.0,<9.0",
  "pytest-cov>=6.0.0,<7.0",
  "ruff>=0.8.0,<1.0",
  "tqdm>=4.67.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_showcase"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["sre_showcase"]

